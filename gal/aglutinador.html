<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aglutinador de Propostas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Evita scroll no body quando modal mobile está aberto */
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="h-screen w-full bg-gray-50 flex flex-col md:flex-row overflow-hidden text-gray-800 font-sans">

    <section class="w-full md:w-[55%] h-full flex flex-col bg-white border-r border-gray-200 shadow-sm relative z-10">
        
        <div class="p-4 md:p-6 border-b border-gray-200 bg-white">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900 flex items-center gap-2 mb-4">
                <i class="ph ph-files text-brand-600 text-2xl md:text-3xl"></i>
                Propostas Recebidas
            </h1>
            
            <div class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                    <input type="text" id="search-input" placeholder="Buscar palavra-chave ou ID..." 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                </div>
                <select id="filter-eixo" class="w-full md:w-1/3 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                    <option value="">Todos os Eixos</option>
                    <option value="Eixo 1">Eixo 1</option>
                    <option value="Eixo 2">Eixo 2</option>
                    <option value="Eixo 3">Eixo 3</option>
                    <option value="Eixo 4">Eixo 4</option>
                </select>
            </div>
        </div>

        <div id="loading-state" class="flex-1 flex flex-col items-center justify-center text-gray-500 bg-gray-50">
            <i class="ph ph-spinner-gap animate-spin text-5xl text-brand-600 mb-4"></i>
            <p class="font-medium">Carregando propostas da planilha...</p>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 custom-scrollbar bg-gray-50/50 hidden pb-24 md:pb-6" id="proposals-list">
            </div>

        <div id="mobile-action-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] md:hidden transform translate-y-full transition-transform duration-300 z-20 flex justify-between items-center">
            <div class="text-sm">
                <span id="mobile-count" class="font-bold text-brand-700 text-lg">0</span> selecionadas
            </div>
            <button onclick="toggleMobileWorkspace(true)" class="bg-brand-600 text-white px-5 py-2 rounded-lg font-semibold flex items-center gap-2">
                Redigir Macro <i class="ph ph-arrow-right font-bold"></i>
            </button>
        </div>
    </section>

    <section id="workspace-panel" class="fixed inset-0 z-50 bg-gray-50 flex flex-col transform translate-y-full transition-transform duration-300 md:static md:translate-y-0 md:w-[45%] md:h-full md:border-l md:border-gray-200">
        
        <div class="p-4 md:p-8 md:pb-6 bg-white md:bg-transparent border-b md:border-0 border-gray-200 flex items-center justify-between">
            <div>
                <h2 class="text-lg md:text-xl font-bold text-gray-900 flex items-center gap-2">
                    <i class="ph ph-git-merge text-brand-600 text-2xl"></i>
                    Aglutinar Propostas
                </h2>
                <p class="text-xs md:text-sm text-gray-500 mt-1 hidden md:block">Selecione propostas ao lado para mesclá-las.</p>
            </div>
            <button onclick="toggleMobileWorkspace(false)" class="p-2 bg-gray-100 rounded-full md:hidden text-gray-600">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <div class="flex-1 flex flex-col p-4 md:p-8 md:pt-0 gap-4 overflow-y-auto">
            <div id="selection-indicator" class="bg-gray-100 border border-gray-200 text-gray-500 px-4 py-3 rounded-lg flex items-center gap-3 transition-all text-sm md:text-base">
                <i class="ph ph-info text-xl indicator-icon"></i>
                <span id="selected-count" class="font-medium">Nenhuma proposta selecionada</span>
            </div>

            <div class="flex flex-col flex-1 min-h-[200px]">
                <label for="macro-textarea" class="block text-sm font-semibold text-gray-700 mb-2">Redação da Proposta Macro</label>
                <textarea id="macro-textarea" 
                    class="w-full flex-1 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none resize-none text-base shadow-inner bg-white disabled:bg-gray-100 transition-all"
                    placeholder="Redija o texto final unificado aqui..." disabled></textarea>
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Abrangência</label>
                    <select id="abrangencia-select" class="w-full border border-gray-300 rounded-lg px-4 py-3 md:py-3 focus:ring-2 focus:ring-brand-500 outline-none bg-white disabled:bg-gray-100 transition-all" disabled>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="Municipal">Municipal</option>
                        <option value="Estadual">Estadual</option>
                        <option value="Nacional">Nacional</option>
                    </select>
                </div>
                
                <div class="flex-1 flex items-end mt-2 md:mt-0 pb-4 md:pb-0">
                    <button id="save-btn" 
                        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 md:py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition-all disabled:opacity-50 flex items-center justify-center gap-2 text-lg md:text-base"
                        disabled>
                        <i class="ph ph-floppy-disk text-xl"></i>
                        Salvar Macro
                    </button>
                </div>
            </div>
        </div>
    </section>

    <div id="toast" class="fixed top-4 md:top-auto md:bottom-6 right-4 md:right-6 bg-gray-900 text-white px-6 py-4 rounded-lg shadow-xl flex items-center gap-3 transform -translate-y-24 md:translate-y-24 opacity-0 transition-all duration-300 z-[100] pointer-events-none">
        <i class="ph ph-check-circle text-green-400 text-2xl" id="toast-icon"></i>
        <div>
            <h4 class="font-bold text-sm" id="toast-title">Sucesso!</h4>
            <p class="text-sm text-gray-300" id="toast-msg">Operação realizada.</p>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DA API (Cole a URL do seu GAS aqui)
        // ==========================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxbAg6XJHHksVwktBFq3VeWgPpeIjv7j82spT4ap2VhMW-s68BFIY8oRp0R61quycBJsg/exec';

        // Estado
        let rawProposals = [];
        let selectedIds = new Set();
        let searchQuery = '';
        let filterEixo = '';

        // Elementos DOM
        const domList = document.getElementById('proposals-list');
        const domLoading = document.getElementById('loading-state');
        const domTextarea = document.getElementById('macro-textarea');
        const domAbrangencia = document.getElementById('abrangencia-select');
        const domSaveBtn = document.getElementById('save-btn');
        const mobileActionBar = document.getElementById('mobile-action-bar');
        const workspacePanel = document.getElementById('workspace-panel');

        // ==========================================
        // INICIALIZAÇÃO E BUSCA DE DADOS (GET)
        // ==========================================
        async function loadData() {
            try {
                // Truque para contornar cache
                const response = await fetch(API_URL + "?t=" + new Date().getTime());
                const result = await response.json();
                
                if (result.success) {
                    rawProposals = result.data;
                    domLoading.classList.add('hidden');
                    domList.classList.remove('hidden');
                    populateFilters();
                    renderList();
                } else {
                    showToast('Erro ao carregar', result.error, 'error');
                }
            } catch (error) {
                showToast('Erro de Conexão', 'Não foi possível acessar a planilha.', 'error');
                domLoading.innerHTML = `<i class="ph ph-warning text-4xl text-red-500 mb-2"></i><p>Erro ao carregar.</p>`;
            }
        }

        // ==========================================
        // RENDERIZAÇÃO
        // ==========================================
        function populateFilters() {
            // Extrai eixos únicos da base para montar o select dinamicamente
            const eixos = [...new Set(rawProposals.map(p => p.eixo))].filter(Boolean).sort();
            const filterDom = document.getElementById('filter-eixo');
            filterDom.innerHTML = '<option value="">Todos os Eixos</option>';
            eixos.forEach(eixo => {
                filterDom.innerHTML += `<option value="${eixo}">${eixo}</option>`;
            });
        }

        function renderList() {
            domList.innerHTML = '';
            
            const filteredProposals = rawProposals.filter(p => {
                const matchSearch = p.text?.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    p.id?.toLowerCase().includes(searchQuery.toLowerCase());
                const matchEixo = filterEixo === '' || p.eixo === filterEixo;
                return matchSearch && matchEixo;
            });

            if(filteredProposals.length === 0) {
                domList.innerHTML = `<div class="text-center py-10 text-gray-500"><i class="ph ph-magnifying-glass text-4xl mb-2 text-gray-300"></i><p>Nenhuma proposta encontrada.</p></div>`;
                return;
            }

            // Otimização: Fragmento de Documento evita reflows múltiplos
            const fragment = document.createDocumentFragment();

            filteredProposals.forEach(p => {
                const isSelected = selectedIds.has(p.id);
                const isAgglutinated = p.status === 'agglutinated';
                
                const card = document.createElement('div');
                let classes = 'bg-white border rounded-xl p-4 md:p-5 transition-all duration-200 relative ';
                
                if (isAgglutinated) {
                    classes += 'border-gray-200 opacity-60 bg-gray-50 cursor-not-allowed grayscale';
                } else if (isSelected) {
                    classes += 'ring-2 ring-brand-500 border-brand-500 bg-brand-50 cursor-pointer shadow-md';
                } else {
                    classes += 'border-gray-200 cursor-pointer shadow-sm';
                }
                
                card.className = classes;
                if (!isAgglutinated) card.onclick = () => toggleSelection(p.id);

                card.innerHTML = `
                    ${isAgglutinated ? `
                        <span class="absolute top-3 right-3 bg-gray-700 text-white text-[10px] uppercase font-bold px-2 py-1 rounded shadow flex items-center gap-1 z-10">
                            <i class="ph-fill ph-lock-key"></i> Aglutinada
                        </span>
                    ` : ''}
                    <div class="flex gap-3 md:gap-4">
                        <div class="pt-1">
                            <input type="checkbox" class="w-5 h-5 text-brand-600 rounded border-gray-300 pointer-events-none"
                                ${isSelected ? 'checked' : ''} ${isAgglutinated ? 'disabled' : ''}>
                        </div>
                        <div class="flex-1">
                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                <span class="bg-gray-100 text-gray-700 text-xs font-mono font-bold px-2 py-1 rounded">${p.id}</span>
                                <span class="text-[11px] font-semibold text-brand-700 bg-brand-100 px-2 py-1 rounded whitespace-nowrap">${p.eixo}</span>
                            </div>
                            <p class="text-gray-800 text-sm leading-relaxed mb-3">${p.text}</p>
                            <div class="flex items-center text-xs text-gray-500 gap-1 mt-auto">
                                <i class="ph-fill ph-map-pin"></i>
                                <span class="truncate"><strong>${p.evento}</strong> • Diretriz: ${p.diretriz}</span>
                            </div>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });

            domList.appendChild(fragment);
        }

        // ==========================================
        // LÓGICA DE SELEÇÃO E UI
        // ==========================================
        function toggleSelection(id) {
            const proposal = rawProposals.find(p => p.id === id);
            if (proposal.status === 'agglutinated') return;

            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            
            renderList();
            updateWorkspace();
        }

        function updateWorkspace() {
            const count = selectedIds.size;
            const ind = document.getElementById('selection-indicator');
            const indText = document.getElementById('selected-count');
            const indIcon = ind.querySelector('.indicator-icon');
            
            // Atualiza Mobile Bar
            document.getElementById('mobile-count').textContent = count;
            if (count > 0) mobileActionBar.classList.remove('translate-y-full');
            else mobileActionBar.classList.add('translate-y-full');

            if (count === 0) {
                indText.textContent = "Nenhuma proposta selecionada";
                ind.className = 'bg-gray-100 border border-gray-200 text-gray-500 px-4 py-3 rounded-lg flex items-center gap-3 transition-all text-sm md:text-base';
                indIcon.className = 'ph ph-info text-xl indicator-icon';
                domTextarea.disabled = domAbrangencia.disabled = true;
            } else {
                indText.textContent = `${count} proposta(s) para aglutinar`;
                ind.className = 'bg-brand-50 border border-brand-200 text-brand-700 px-4 py-3 rounded-lg flex items-center gap-3 transition-all text-sm md:text-base';
                indIcon.className = 'ph-fill ph-check-circle text-xl indicator-icon';
                domTextarea.disabled = domAbrangencia.disabled = false;
            }
            validateForm();
        }

        function validateForm() {
            domSaveBtn.disabled = !(selectedIds.size > 0 && domTextarea.value.trim().length > 5 && domAbrangencia.value !== "");
        }

        function toggleMobileWorkspace(show) {
            if(show) {
                workspacePanel.classList.remove('translate-y-full');
                document.body.classList.add('modal-open');
            } else {
                workspacePanel.classList.add('translate-y-full');
                document.body.classList.remove('modal-open');
            }
        }

        // ==========================================
        // ENVIO DE DADOS (POST)
        // ==========================================
        async function handleSave() {
            const payload = {
                macroText: domTextarea.value,
                abrangencia: domAbrangencia.value,
                originIds: Array.from(selectedIds)
            };

            domSaveBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> Salvando...';
            domSaveBtn.disabled = true;

            try {
                // IMPORTANTE: Envio via POST usando "text/plain" (Evita bloqueio de CORS do Google Apps Script)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if(result.success) {
                    showToast('Macro Salva!', `ID: ${result.macroId}`, 'success');
                    
                    // Atualiza estado local para refletir a mudança sem precisar dar reload na planilha inteira
                    rawProposals.forEach(p => {
                        if (selectedIds.has(p.id)) p.status = 'agglutinated';
                    });

                    // Reseta UI
                    selectedIds.clear();
                    domTextarea.value = '';
                    domAbrangencia.value = '';
                    toggleMobileWorkspace(false);
                    updateWorkspace();
                    renderList();
                } else {
                    throw new Error(result.error);
                }
            } catch(e) {
                showToast('Erro ao salvar', 'Tente novamente. Detalhe: ' + e.message, 'error');
            } finally {
                domSaveBtn.innerHTML = '<i class="ph ph-floppy-disk text-xl"></i> Salvar Macro';
                validateForm();
            }
        }

        // UI Auxiliar
        function showToast(title, msg, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            
            const icon = document.getElementById('toast-icon');
            if(type === 'success') {
                icon.className = 'ph-fill ph-check-circle text-green-400 text-3xl';
            } else {
                icon.className = 'ph-fill ph-warning-circle text-red-400 text-3xl';
            }

            toast.classList.remove('opacity-0', 'translate-y-24', '-translate-y-24');
            setTimeout(() => {
                toast.classList.add('opacity-0');
                // Adiciona translate dependendo da tela (mobile desce por cima, desktop por baixo)
                if(window.innerWidth < 768) toast.classList.add('-translate-y-24');
                else toast.classList.add('translate-y-24');
            }, 4000);
        }

        // Eventos DOM
        document.getElementById('search-input').addEventListener('input', (e) => { searchQuery = e.target.value; renderList(); });
        document.getElementById('filter-eixo').addEventListener('change', (e) => { filterEixo = e.target.value; renderList(); });
        domTextarea.addEventListener('input', validateForm);
        domAbrangencia.addEventListener('change', validateForm);
        domSaveBtn.addEventListener('click', handleSave);

        // Dispara o boot da aplicação
        loadData();
    </script>
</body>
</html>
